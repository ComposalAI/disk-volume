name: Verify Modal dependency volumes
on:
  workflow_dispatch:
    inputs:
      size:
        description: Runner size
        default: '2'
        type: choice
        options: ['2', '4']
      expected_hit:
        description: Expect a trusted snapshot
        default: 'false'
        type: choice
        options: ['false', 'true']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ["composal-x64-${{ inputs.size || '4' }}x"]
    steps:
      - uses: actions/checkout@v4
      - uses: composalai/disk-volume@v1
        id: disk
        with:
          key: volume-canary-v1
          path: /tmp/dependency-store
      - name: Verify restore and isolation
        env:
          CACHE_HIT: ${{ steps.disk.outputs.cache-hit }}
          EXPECTED_HIT: ${{ inputs.expected_hit || 'true' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          test "$CACHE_HIT" = "$EXPECTED_HIT"
          findmnt -T /tmp/dependency-store
          if [ "$CACHE_HIT" = true ]; then
            test "$(cat /tmp/dependency-store/proof)" = trusted
            npm cache add is-number@7.0.0 --offline --cache /tmp/dependency-store
          else
            npm cache add is-number@7.0.0 --cache /tmp/dependency-store
          fi
          if [ "$EVENT" = pull_request ]; then
            printf untrusted-pr > /tmp/dependency-store/proof
          else
            printf trusted > /tmp/dependency-store/proof
          fi
          echo "Verified dependency cache: hit=$CACHE_HIT event=$EVENT"
