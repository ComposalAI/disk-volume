name: Verify dependency volumes
on:
  workflow_dispatch:
    inputs:
      size:
        description: Runner size
        default: '2'
        type: choice
        options: ['2', '4']
      expected_hit:
        description: Expect a trusted snapshot
        default: 'false'
        type: choice
        options: ['false', 'true']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ["composal-x64-${{ inputs.size || '4' }}x"]
    steps:
      - uses: actions/checkout@v4
      - run: node --test main.test.cjs post.test.cjs
      - uses: ./
        id: disk
        with:
          key: direct-volume-canary-v2
          path: /tmp/dependency-store
      - name: Verify mounted cache persistence
        env:
          CACHE_HIT: ${{ steps.disk.outputs.cache-hit }}
          EXPECTED_HIT: ${{ inputs.expected_hit || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ -n "$EXPECTED_HIT" ]; then test "$CACHE_HIT" = "$EXPECTED_HIT"; fi
          findmnt -T /tmp/dependency-store
          if [ "$CACHE_HIT" = true ]; then
            test "$(cat /tmp/dependency-store/proof)" = persisted
            npm cache add is-number@7.0.0 --offline --cache /tmp/dependency-store
          else
            npm cache add is-number@7.0.0 --cache /tmp/dependency-store
          fi
          printf persisted > /tmp/dependency-store/proof
          case "$(realpath "$GITHUB_WORKSPACE")" in "$COMPOSAL_DISK_ROOT"/*) exit 1;; esac
          echo "Verified dependency cache: hit=$CACHE_HIT event=$EVENT"
